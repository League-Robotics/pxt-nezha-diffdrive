[project]
name = "pxt-nezha-diffdrive-host-tests"
version = "0.20260902.2"
description = "Native host test harness for this extension's portable C++ (DiffDrive kernel, and the sprint 003 wire/motion modules it grows into). No Python package of its own -- every module under test is C++, compiled on demand into a throwaway shared library and driven through ctypes; see tests/host/README.md."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pyserial>=3.5",
    # The overhead camera's client + daemon. tools/field_dance.py and the
    # field harness talk to the aprilcam daemon directly, so it has to be
    # importable from this project's own venv -- not only from the pipx
    # install that happens to be on PATH.
    "aprilcam[daemon]",
]

# This project has no installable Python package -- src/ is C++/TypeScript
# (a MakeCode/PXT extension), not a Python source tree. `uv run pytest`
# only needs pytest itself available in a synced venv; there is nothing
# here for uv to build or install, so it must not try.
# ruff is configured below but was never declared, so it lived in the
# venv only by accident and the first real `uv sync` pruned it. Declared
# here so linting the tree does not depend on what someone happened to
# install once.
[dependency-groups]
dev = ["ruff>=0.16"]

[tool.uv]
package = false

# aprilcam is a sibling checkout, not a published wheel. Editable so this
# project follows its working tree rather than pinning a stale copy --
# the camera code and this repo's field work move together.
[tool.uv.sources]
aprilcam = { path = "../aprilcam", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

# Sprint 017 ticket 007: narrow, meaningful rule set -- pyflakes (F),
# syntax errors (E9), flake8-bugbear (B). `select` (not `extend-select`)
# replaces ruff's unconfigured defaults entirely, so the import-order
# (I001), shebang (EXE001), and the long RUF/UP/SIM/PLW style-preference
# tail an unconfigured `ruff check` surfaces here never run -- this
# project's own conventions differ from those defaults (e.g. the
# sys.path.insert prelude several tools/tests use makes strict import
# sorting awkward by construction), and re-litigating them wasn't this
# ticket's job.
[tool.ruff.lint]
select = ["F", "E9", "B"]

# B905 (zip-without-explicit-strict) surfaced 15 call sites across
# tools/ and tests/tools/ that this ticket's review never examined.
# Choosing strict=True vs strict=False per site is a per-call-site
# correctness judgment (does a length mismatch there indicate a real
# bug worth failing loudly on, or is truncation the intended,
# already-relied-upon behavior?) -- not a mechanical lint fix, and this
# ticket is lint hygiene, not a refactor (see the ticket's own "no
# behavior change beyond the import removals and from-e additions"
# scope). Deferred to a follow-up review; ignored project-wide rather
# than 15 scattered per-line noqas that would just paper over the same
# unreviewed question at each site.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixture redefinition is idiomatic (a test module importing a
# fixture by name to use it looks, to pyflakes, like shadowing an
# unused import) -- not a real defect. 94 instances as of this ticket,
# all of this shape.
"tests/**" = ["F811"]
